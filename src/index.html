<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitTrack Dashboard</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #333;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .dashboard-container {
        background: #ffffff;
        padding: 30px 40px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        max-width: 800px;
        width: 100%;
        box-sizing: border-box;
      }
      .header-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .header-controls h1 {
        margin: 0;
        flex-grow: 1;
        text-align: center;
      }
      #logout-btn {
        background-color: #f44336;
        padding: 8px 15px;
        border-radius: 6px;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 0.9em;
        transition: background-color 0.2s;
      }
      #logout-btn:hover {
        background-color: #d32f2f;
      }
      #backendBadge {
        font-size: 0.75em;
        color: #888;
        text-align: right;
        margin-bottom: 10px;
      }
      .workout-form {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .workout-form input[type='text'],
      .workout-form input[type='number'],
      .workout-form input[type='date'],
      .workout-form select {
        flex: 1;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        min-width: 120px;
      }
      .workout-form button {
        padding: 12px 25px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .workout-form button:hover {
        background: #5a6fd6;
      }
      .workout-list {
        list-style: none;
        padding: 0;
      }
      .workout-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        margin-bottom: 10px;
        background-color: #f9f9f9;
        border: 1px solid #eee;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      .workout-info {
        flex-grow: 1;
      }
      .workout-info strong {
        color: #444;
      }
      .workout-info small {
        color: #666;
      }
      .workout-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .btn {
        border: none;
        padding: 8px 15px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9em;
        transition: background-color 0.2s;
      }
      .btn-primary {
        background-color: #667eea;
        color: white;
      }
      .btn-primary:hover {
        background-color: #5a6fd6;
      }
      .btn-success {
        background-color: #28a745;
        color: white;
      }
      .btn-success:hover {
        background-color: #218838;
      }
      .btn-secondary {
        background-color: #6c757d;
        color: white;
      }
      .btn-secondary:hover {
        background-color: #5a6268;
      }
      .btn-danger {
        background-color: #ff4444;
        color: white;
      }
      .btn-danger:hover {
        background-color: #cc0000;
      }
      .edit-form {
        margin-top: 10px;
        padding: 15px;
        background-color: #eef2ff;
        border-radius: 8px;
        border: 1px solid #c5cae9;
      }
      .form-row {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .form-row input,
      .form-row select {
        flex: 1;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        min-width: 100px;
      }
      .empty-state {
        text-align: center;
        color: #888;
        padding: 20px;
        background-color: #f0f0f0;
        border-radius: 8px;
        margin-top: 20px;
      }
      .alert {
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 6px;
        font-weight: bold;
        text-align: center;
        display: none;
      }
      .alert-danger {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .alert-success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .summary-section {
        display: flex;
        justify-content: space-around;
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #eee;
        flex-wrap: wrap;
        gap: 20px;
      }
      .summary-card {
        background-color: #eef2ff;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        flex: 1;
        min-width: 150px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .summary-card h4 {
        color: #5a6fd6;
        margin-top: 0;
        margin-bottom: 10px;
      }
      .summary-card p {
        font-size: 1.8em;
        font-weight: bold;
        color: #333;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <div class="header-controls">
        <h1>FitTrack Dashboard</h1>
        <button id="logout-btn">Log Out</button>
      </div>

      <div id="backendBadge"></div>

      <div id="status" class="alert"></div>

      <form id="workout-form" class="workout-form">
        <input type="date" id="date" required />
        <select id="type" required>
          <option value="" disabled selected>Workout Type</option>
          <option value="Running">Running</option>
          <option value="Cycling">Cycling</option>
          <option value="Swimming">Swimming</option>
          <option value="Weights">Weights</option>
          <option value="Yoga">Yoga</option>
          <option value="Walking">Walking</option>
        </select>
        <input
          type="number"
          id="duration"
          placeholder="Minutes"
          required
          min="1"
          max="1440"
        />
        <button type="submit">Add Workout</button>
      </form>

      <div id="editFormContainer"></div>

      <div class="summary-section">
        <div class="summary-card">
          <h4>Total Workouts</h4>
          <p id="total-workouts">0</p>
        </div>
        <div class="summary-card">
          <h4>Total Minutes</h4>
          <p id="total-minutes">0</p>
        </div>
        <div class="summary-card">
          <h4>Avg Duration</h4>
          <p id="avg-duration">0</p>
        </div>
        <div class="summary-card">
          <h4>Favorite Type</h4>
          <p id="favorite-type">-</p>
        </div>
      </div>

      <h2>Your Workouts</h2>
      <div id="workouts-container"></div>
    </div>

    <script src="storage.js"></script>
    <script src="app.js"></script>
  </body>
</html>
