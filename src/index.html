<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitTrack - Hello Path</title>
  </head>
 <body>
    <div id="status">System ready - localStorage connected</div>

    <section id="logging-section">
        <h3>Log a New Workout</h3>
        <form id="workout-form">
            <input type="text" id="workout-type" placeholder="Activity (e.g., Running)" required>
            <input type="number" id="workout-duration" placeholder="Duration (mins)" required>
            <button type="submit">Save Workout</button>
        </form>
    </section>

    <hr>

    <section id="viewing-section">
        <h3>Your Activity History</h3>
        <div id="workout-list">
            <p>No workouts yet. Add one above!</p>
        </div>
    </section>

    <script src="storage.js"></script>
    <script src="app.js"></script>
</body>
</html>
